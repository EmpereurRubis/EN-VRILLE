<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="theme-color" content="#f8f5ee"/>
    <meta name="description" content="EN VRILLE, votre émission de soirée. Une scène, vos téléphones en manettes, cinq mini-jeux et des idées en roue libre."/>
    <title>EN VRILLE — Faites dérailler la soirée.</title>
    <script>
      (() => {
        let preference = 'system';
        try { preference = localStorage.getItem('vrille-theme') || 'system'; } catch {}
        const dark = preference === 'dark' || (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#111113' : '#f8f5ee';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
