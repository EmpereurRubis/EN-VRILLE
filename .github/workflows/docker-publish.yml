name: Tester et publier EN VRILLE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: en-vrille-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: en_vrille_test
          POSTGRES_USER: en_vrille
          POSTGRES_PASSWORD: test_password_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U en_vrille -d en_vrille_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://en_vrille:test_password_only@localhost:5432/en_vrille_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspace @en-vrille/api --workspace @en-vrille/web --workspace @en-vrille/shared --workspace @en-vrille/content --include-workspace-root
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  production-smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEB_IMAGE: en-vrille-web
      API_IMAGE: en-vrille-api
      IMAGE_TAG: test
      PUBLIC_URL: http://127.0.0.1:8080
      APP_BIND: 127.0.0.1
      APP_PORT: "8080"
      POSTGRES_DB: en_vrille_smoke
      POSTGRES_USER: en_vrille_smoke
      POSTGRES_PASSWORD: ci_only_postgres_password_for_disposable_smoke
      SESSION_SECRET: ci-only-session-secret-for-disposable-production-smoke-123456789
      ADMIN_TOKEN: ci-only-admin-token-for-disposable-production-smoke-123456789
      SMOKE_PRODUCTION: "1"
      SMOKE_RESTART_API: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspace @en-vrille/api --workspace @en-vrille/web --workspace @en-vrille/shared --workspace @en-vrille/content --include-workspace-root
      - name: Construire les images de production
        run: |
          docker build -t en-vrille-web:test -f deploy/web.Dockerfile .
          docker build -t en-vrille-api:test -f deploy/api.Dockerfile .
      - name: Valider et démarrer la stack complète
        run: |
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 120
      - name: Vérifier le jeu et la persistance après redémarrage API
        run: npm run smoke -- http://127.0.0.1:8080
      - name: Journaux de la stack en cas d’échec
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Supprimer les conteneurs et volumes temporaires du runner CI
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    if: github.event_name != 'pull_request'
    needs: production-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: web
            dockerfile: deploy/web.Dockerfile
          - component: api
            dockerfile: deploy/api.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/empereurrubis/en-vrille-${{ matrix.component }}
          tags: |
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=long
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
